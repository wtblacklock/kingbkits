<!doctype html><html><head><meta charset='utf-8'><style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Archivo+Black&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:2000px;height:2000px;overflow:hidden;}
body{font-family:'Raleway',sans-serif;position:relative;}
.kb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#000;
  border-radius:24px;padding:18px 30px 20px;font-family:'Archivo Black',sans-serif;line-height:0.92;
  text-align:center;width:fit-content;}
.kb .l1{font-size:40px;color:#f3c318;}
.kb .l2{font-size:28px;color:#fff;letter-spacing:0.02em;margin-top:2px;}
.pill{display:inline-flex;align-items:center;font-weight:700;font-size:32px;padding:12px 30px;
  border-radius:999px;color:#000;}
.cap{font-size:32px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;}
.grain{position:absolute;inset:0;filter:url(#grain);opacity:0.42;mix-blend-mode:overlay;background:#fff;}
</style></head><body>
<svg style="position:absolute;width:0;height:0"><defs>
  <filter id="wood">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.09" numOctaves="4" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
  </filter>
  <filter id="haze">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.011" numOctaves="5" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>
</defs></svg>

<div style="position:absolute;inset:0;background:
  radial-gradient(ellipse 1600px 1300px at 66% 14%,#4a3a2c 0%,#2b211a 40%,#17110d 76%,#0f0a07 100%);"></div>
<div style="position:absolute;left:760px;top:-320px;width:1560px;height:1750px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,198,120,0.30),rgba(255,170,80,0.10) 42%,rgba(0,0,0,0) 68%);
  filter:blur(24px);"></div>
<div style="position:absolute;left:0;right:0;top:120px;height:900px;filter:url(#haze);
  opacity:0.15;mix-blend-mode:screen;background:#e8d3b0;"></div>
<div style="position:absolute;left:150px;top:250px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,225,160,0.42),rgba(255,225,160,0.231) 55%,rgba(255,225,160,0) 72%);filter:blur(26px);"></div><div style="position:absolute;left:420px;top:150px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,225,160,0.36),rgba(255,225,160,0.198) 55%,rgba(255,225,160,0) 72%);filter:blur(18px);"></div><div style="position:absolute;left:1560px;top:330px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,225,160,0.34),rgba(255,225,160,0.18700000000000003) 55%,rgba(255,225,160,0) 72%);filter:blur(22px);"></div><div style="position:absolute;left:1800px;top:180px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,225,160,0.3),rgba(255,225,160,0.165) 55%,rgba(255,225,160,0) 72%);filter:blur(26px);"></div><div style="position:absolute;left:940px;top:120px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,225,160,0.26),rgba(255,225,160,0.14300000000000002) 55%,rgba(255,225,160,0) 72%);filter:blur(16px);"></div><div style="position:absolute;left:260px;top:520px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,225,160,0.22),rgba(255,225,160,0.12100000000000001) 55%,rgba(255,225,160,0) 72%);filter:blur(16px);"></div>
<div style="position:absolute;left:0;right:0;top:560px;bottom:0;
  background:linear-gradient(180deg,#3a2418 0%,#21130a 45%,#120a04 100%);"></div>
<div style="position:absolute;left:0;right:0;top:560px;bottom:0;filter:url(#wood);
  opacity:0.58;mix-blend-mode:multiply;background:#170c05;"></div>
<div style="position:absolute;left:100px;top:90px;">
  <div class="cap" style="color:#e0c397;">05&ndash;07 &middot; Tasting Cards</div>
</div>
<div style="position:absolute;right:100px;top:100px;"><div class="kb"><span class="l1">KINGB</span><span class="l2">KITS</span></div></div>
<div style="position:absolute;left:50%;top:300px;transform:translateX(-50%) rotate(0deg);">
  <img src="../listing_images_agave/page-6.png" style="width:1520px;display:block;box-shadow:0 14px 30px rgba(0,0,0,0.55), 0 90px 130px -40px rgba(0,0,0,0.9);">
</div><div class="grain"></div></body></html>
