<!doctype html><html><head><meta charset='utf-8'><style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Archivo+Black&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:2000px;height:2000px;overflow:hidden;}
body{font-family:'Raleway',sans-serif;position:relative;}
.kb{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#000;
  border-radius:24px;padding:18px 30px 20px;font-family:'Archivo Black',sans-serif;line-height:0.92;
  text-align:center;width:fit-content;}
.kb .l1{font-size:40px;color:#f3c318;}
.kb .l2{font-size:28px;color:#fff;letter-spacing:0.02em;margin-top:2px;}
.pill{display:inline-flex;align-items:center;font-weight:700;font-size:32px;padding:12px 30px;
  border-radius:999px;color:#000;}
.cap{font-size:32px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;}
.grain{position:absolute;inset:0;filter:url(#grain);opacity:0.4;mix-blend-mode:overlay;background:#fff;}
</style></head><body>
<svg style="position:absolute;width:0;height:0"><defs>
  <filter id="wood">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.09" numOctaves="4" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
  </filter>
  <filter id="stone">
    <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="5" seed="9"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
  </filter>
  <filter id="stone-fine">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="14"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
  </filter>
  <filter id="haze">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.011" numOctaves="5" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>
</defs></svg>

<div style="position:absolute;inset:0;background:
  radial-gradient(ellipse 1600px 1300px at 66% 14%,#5a2f6e 0%,#341b42 40%,#1a0e22 76%,#0a0510 100%);"></div>
<div style="position:absolute;left:760px;top:-320px;width:1560px;height:1750px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,140,60,0.24),rgba(255,110,60,0.08) 42%,rgba(0,0,0,0) 68%);
  filter:blur(24px);"></div>
<div style="position:absolute;left:0;right:0;top:120px;height:900px;filter:url(#haze);
  opacity:0.2;mix-blend-mode:screen;background:#c98be0;"></div>
<div style="position:absolute;left:120px;top:760px;width:9px;height:9px;border-radius:50%;background:#ffb703;opacity:0.4;"></div><div style="position:absolute;left:1840px;top:700px;width:8px;height:8px;border-radius:50%;background:#e0763a;opacity:0.35;"></div><div style="position:absolute;left:1700px;top:140px;width:7px;height:7px;border-radius:50%;background:#c94f7a;opacity:0.4;"></div><div style="position:absolute;left:300px;top:140px;width:6px;height:6px;border-radius:50%;background:#ffb703;opacity:0.3;"></div><div style="position:absolute;left:1600px;top:950px;width:7px;height:7px;border-radius:50%;background:#e0763a;opacity:0.3;"></div>
<div style="position:absolute;left:0;right:0;top:575px;bottom:0;
  background:linear-gradient(180deg,#2c2a2f 0%,#19171b 45%,#0a090b 100%);"></div>
<div style="position:absolute;left:0;right:0;top:575px;bottom:0;filter:url(#stone);
  opacity:0.58;mix-blend-mode:multiply;background:#0c0b0d;"></div>
<div style="position:absolute;left:0;right:0;top:575px;height:9px;
  background:linear-gradient(180deg,rgba(255,150,80,0.35),rgba(255,150,80,0));"></div>
<div style="position:absolute;left:100px;top:90px;">
  <div class="cap" style="color:#e0b48c;">01 &middot; Party Guide</div>
</div>
<div style="position:absolute;right:100px;top:100px;"><div class="kb"><span class="l1">KINGB</span><span class="l2">KITS</span></div></div>
<div style="position:absolute;left:50%;top:300px;transform:translateX(-50%) rotate(0deg);">

</div><div class="grain"></div></body></html>
