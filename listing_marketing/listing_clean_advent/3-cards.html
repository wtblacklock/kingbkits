<!doctype html><html><head><meta charset='utf-8'><style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:2000px;height:2000px;overflow:hidden;}
body{font-family:'Raleway',sans-serif;position:relative;background:#0d0b08;}
.pill{display:inline-flex;align-items:center;font-weight:700;font-size:32px;padding:12px 30px;
  border-radius:999px;color:#000;}
.cap{font-size:32px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;}
.grain{position:absolute;inset:0;filter:url(#grain);opacity:0.12;mix-blend-mode:overlay;background:#fff;}
</style></head><body>
<svg style="position:absolute;width:0;height:0"><defs>
  <filter id="wood">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.09" numOctaves="4" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
  </filter>
  <filter id="stone">
    <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="5" seed="9"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
  </filter>
  <filter id="stone-fine">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="14"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
  </filter>
  <filter id="haze">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.011" numOctaves="5" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>
</defs></svg>

<div style="position:absolute;inset:0;background:#f3efe6;"></div>
<div style="position:absolute;inset:0;opacity:0.5;
  background-image:linear-gradient(rgba(47,74,58,0.08) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(47,74,58,0.08) 1px,transparent 1px);
  background-size:83.3px 83.3px;"></div>
<div style="position:absolute;left:60%;top:-280px;width:1500px;height:1500px;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,196,90,0.30),rgba(255,196,90,0) 62%);
  filter:blur(20px);"></div>
<div style="position:absolute;left:140px;top:1750px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(47,74,58,0.5),rgba(47,74,58,0.275) 55%,rgba(47,74,58,0) 72%);filter:blur(3px);"></div><div style="position:absolute;left:1850px;top:120px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(47,74,58,0.5),rgba(47,74,58,0.275) 55%,rgba(47,74,58,0) 72%);filter:blur(3px);"></div><div style="position:absolute;left:1920px;top:1800px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(47,74,58,0.4),rgba(47,74,58,0.22000000000000003) 55%,rgba(47,74,58,0) 72%);filter:blur(3px);"></div>
<div style="position:absolute;left:0;right:0;bottom:0;height:420px;
  background:linear-gradient(180deg,rgba(243,239,230,0) 0%,rgba(243,239,230,0.6) 100%);"></div>
<div style="position:absolute;left:100px;top:90px;">
  <div class="cap" style="color:#2f4a3a;">02&ndash;07 &middot; Tasting Cards</div>
</div>

<div style="position:absolute;left:50%;top:300px;transform:translateX(-50%) rotate(0deg);">

</div><div class="grain"></div></body></html>
